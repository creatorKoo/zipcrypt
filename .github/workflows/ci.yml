name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.24", stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - run: go test ./...
      - if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...

  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: sudo apt-get update && sudo apt-get install -y unzip libarchive-tools p7zip-full
      - name: yeka/zip, both directions
        working-directory: interop
        run: go test ./...
      - name: unzip, Python, bsdtar and 7-Zip
        run: STRICT=1 interop/check.sh
